<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Categorías</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="dark-theme">
<!-- Se incluye Font Awesome para los iconos y un archivo CSS para estilos personalizados -->
<!-- Se define el título de la página como "Gestión de Categorías" -->

<!-- Barra de navegación principal -->
<nav class="navbar">
  <div class="nav-container">
    <div class="nav-brand">
      <i class="fas fa-tags"></i>
      <span>Portal Categorías</span>
    </div>
    <ul class="nav-menu">
      <li><a href="index.html"><i class="fas fa-home"></i> Inicio</a></li>
      <li><a href="estudiantes.html"><i class="fas fa-users"></i> Estudiantes</a></li>
      <li><a href="carreras.html"><i class="fas fa-book-open"></i> Carreras</a></li>
      <li><a href="categorias.html" class="active"><i class="fas fa-tags"></i> Categorías</a></li>
    </ul>
  </div>
</nav>
<!-- Barra de navegación que conecta con las demás páginas del sistema.
     Se resalta “Categorías” como activa con `class="active"`. -->

<main class="container">
  <header class="page-header">
    <h1><i class="fas fa-tags"></i> Gestión de Categorías</h1>
    <p>Administra las categorías académicas del sistema</p>
  </header>
  <!-- Sección principal que contiene el título y la descripción de la página. -->

  <!-- Sección: Registrar Categoría -->
  <section class="card">
    <div class="card-header">
      <h2><i class="fas fa-plus-circle"></i> Registrar Nueva Categoría</h2>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label for="registerName" class="form-label">Nombre de la Categoría</label>
        <input type="text" id="registerName" class="form-control" placeholder="Ej. Ciencias Básicas">
      </div>
      <button class="btn btn-primary" onclick="registerCategories()">
        <i class="fas fa-save"></i> Registrar Categoría
      </button>
      <div class="category-result" id="registerResult"></div>
    </div>
  </section>
  <!-- Esta sección permite ingresar el nombre de una nueva categoría.
       Al hacer clic en “Registrar”, se llama a `registerCategories()` 
       definida en `app.js`. El resultado se muestra en `registerResult`. -->

  <!-- Sección: Buscar categoría por ID -->
  <section class="card">
    <div class="card-header">
      <h2><i class="fas fa-search"></i> Buscar Categoría por ID</h2>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label for="categoryId" class="form-label">ID de la Categoría</label>
        <input type="number" id="categoryId" class="form-control" placeholder="Ingrese el ID">
      </div>
      <button class="btn btn-secondary" onclick="getCategoriesById()">
        <i class="fas fa-search"></i> Buscar
      </button>
      <div class="category-result" id="getResult"></div>
    </div>
  </section>
<!-- Aquí se puede ingresar un ID para buscar una categoría específica.
       Se llama a `getCategoriesById()` que consulta al backend y
       muestra el resultado en `getResult`. -->

  <!-- Sección: Eliminar categoría -->
  <section class="card">
    <div class="card-header">
      <h2><i class="fas fa-trash-alt"></i> Eliminar Categoría</h2>
    </div>
    <div class="card-body">
      <div class="form-group">
        <label for="deleteId" class="form-label">ID de la Categoría</label>
        <input type="number" id="deleteId" class="form-control" placeholder="Ingrese el ID">
      </div>
      <button class="btn btn-danger" onclick="deleteCategories()">
        <i class="fas fa-trash-alt"></i> Eliminar
      </button>
      <div class="category-result" id="deleteResult"></div>
    </div>
  </section>
  <!-- Esta sección elimina una categoría existente por su ID.
       Ejecuta `deleteCategories()` que muestra el resultado en `deleteResult`. -->

</main>

<!-- Scripts necesarios -->
<script src="app.js"></script>
<!-- Se carga el archivo `app.js` donde están las funciones llamadas desde los botones. -->
</body>
</html>
